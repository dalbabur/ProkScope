services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    command: sh -c "if [ ! -d node_modules ]; then npm ci --ignore-scripts; fi && npm run dev -- --host 0.0.0.0 --strictPort"
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://app:8000
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      - app

volumes:
  frontend_node_modules:
